name: Build MoonsideT1 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project & Info.plist
        run: |
          brew install xcodegen
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>MoonsideT1</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>需要蓝牙权限以在后台控制 Moonside T1 氛围灯</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>需要蓝牙权限以在后台控制 Moonside T1 氛围灯</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>bluetooth-central</string>
              </array>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > project.yml
          name: MoonsideT1
          options:
            bundleIdPrefix: com.moonside
            deploymentTarget:
              iOS: "16.0"
          targets:
            MoonsideT1:
              type: application
              platform: iOS
              sources:
                - App.swift
              info:
                path: Info.plist
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.moonside.t1controller
                MARKETING_VERSION: "1.0.0"
                CURRENT_PROJECT_VERSION: "1"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
                ENABLE_APP_INTENTS: YES
          EOF
          xcodegen generate

      - name: Build Unsigned IPA
        run: |
          xcodebuild -project MoonsideT1.xcodeproj \
            -scheme MoonsideT1 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MoonsideT1.app Payload/
          zip -r MoonsideT1.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonsideT1-IPA
          path: MoonsideT1.ipa
